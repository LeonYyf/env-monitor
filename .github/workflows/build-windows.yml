name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:   # 也可在 GitHub 网页上手动点「Run workflow」

# 允许工作流里的 GITHUB_TOKEN 写 Release（上传 exe 资产用）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 打包成单文件 exe
        run: pyinstaller --onefile --windowed --name EnvMonitor --runtime-hook runtime_hook.py --hidden-import sqlalchemy.dialects.sqlite main.py

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: EnvMonitor-windows
          path: dist/EnvMonitor.exe

      # 直接从 GitHub 的 CI 服务器把 exe 挂到 Release v2.0.1，
      # 避免在本地网络上传大文件时被「Connection reset」中断。
      # Release 不存在则自动创建（生成发布说明），存在则跳过创建、直接上传资产。
      - name: 发布到 Release v2.0.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.0.1 >/dev/null 2>&1 || \
            gh release create v2.0.1 --generate-notes --title "v2.0.1"
          gh release upload v2.0.1 dist/EnvMonitor.exe --clobber
